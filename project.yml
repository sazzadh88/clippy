name: Clippy
options:
  bundleIdPrefix: in.f9x
  deploymentTarget:
    macOS: "14.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: "2.4.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
targets:
  Clippy:
    type: application
    platform: macOS
    sources: [Clippy]
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: Clippy/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: Clippy
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.f9x.Clippy
        ENABLE_HARDENED_RUNTIME: NO
    scheme:
      testTargets: [ClippyTests]
  ClippyTests:
    type: bundle.unit-test
    platform: macOS
    sources: [ClippyTests]
    dependencies:
      - target: Clippy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.f9x.ClippyTests
        GENERATE_INFOPLIST_FILE: YES
