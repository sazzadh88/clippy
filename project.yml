name: NotchClip
options:
  bundleIdPrefix: in.f9x
  deploymentTarget:
    macOS: "14.0"
packages:
  KeyboardShortcuts:
    url: https://github.com/sindresorhus/KeyboardShortcuts
    exactVersion: "2.4.0"
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
targets:
  NotchClip:
    type: application
    platform: macOS
    sources: [NotchClip]
    dependencies:
      - package: KeyboardShortcuts
    info:
      path: NotchClip/Info.plist
      properties:
        LSUIElement: true
        CFBundleDisplayName: NotchClip
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        NSHumanReadableCopyright: ""
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.f9x.NotchClip
        ENABLE_HARDENED_RUNTIME: NO
    scheme:
      testTargets: [NotchClipTests]
  NotchClipTests:
    type: bundle.unit-test
    platform: macOS
    sources: [NotchClipTests]
    dependencies:
      - target: NotchClip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: in.f9x.NotchClipTests
        GENERATE_INFOPLIST_FILE: YES
